name: Build and release A50 Android 11

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['a50-*']

permissions:
  contents: read

concurrency:
  group: a50-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Android 11 / ${{ matrix.variant }} / enforcing
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [aosp, oneui]
    steps:
      - name: Checkout exact source and KernelSU revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            libelf-dev libncurses5 libncurses-dev lib32stdc++6 libc6-dev-i386 \
            cpio zip unzip lz4 lzop rsync python3

      - name: Verify integration patches and pinned dependencies
        run: bash scripts/verify-ksunext.sh

      - name: Build TWRP package
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p ci-logs
          bash build.sh --automated --device a50 --android 11 --variant "$VARIANT" --kernelsu 2>&1 | tee ci-logs/build.log

      - name: Validate ZIP and collect public build metadata
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 scripts/validate-a50-package.py "$VARIANT"
          mkdir -p release
          cp out/*.zip release/
          cp .config "release/kernel-config-${VARIANT}-android11.txt"
          {
            printf 'source=%s\nvariant=%s\nandroid=11\nselinux=enforcing\n' "$GITHUB_SHA" "$VARIANT"
            printf 'kernelsu=%s\n' "$(git -C KernelSU rev-parse HEAD)"
            printf 'toolchain=%s\n' "$(git -C toolchain rev-parse HEAD)"
            printf 'susfs=v2.2.0\n'
            sha256sum kernel/patches/*.patch
          } > "release/build-info-${VARIANT}.txt"

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a50-android11-${{ matrix.variant }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-${{ matrix.variant }}
          path: ci-logs/build.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish both variants
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download both validated packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: a50-android11-*
          merge-multiple: true
          path: release

      - name: Publish immutable run release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          zips=(release/*.zip)
          test "${#zips[@]}" -eq 2
          cp Documentation/a50-release.md release-notes.md
          printf '\nSource commit: `%s`\nWorkflow run: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          (cd release && sha256sum ./*.zip ./*.txt > SHA256SUMS)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="a50-a11-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" \
            --title "Mint A50 Android 11 - KSU Next + SUSFS 2.2.0 ($tag)" \
            --notes-file release-notes.md
