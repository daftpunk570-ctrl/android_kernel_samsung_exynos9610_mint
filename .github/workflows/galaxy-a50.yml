name: Build A50 AOSP 11 (BakaSU/SUSFS 2.3.0)

on:
  workflow_dispatch:
  push:
    branches: [a50-gsi-bakasu-susfs230]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Android 11 / ${{ matrix.variant }} / enforcing
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [aosp, oneui]
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            libelf-dev libncurses5 libncurses-dev lib32stdc++6 libc6-dev-i386 \
            cpio zip unzip lz4 lzop rsync python3

      - name: Build package
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p ci-logs
          bash build.sh --automated --device a50 --android 11 --variant "$VARIANT" --kernelsu 2>&1 | tee ci-logs/build.log

      - name: Collect outputs
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p release
          cp out/*.zip release/ || true
          cp .config "release/kernel-config-${VARIANT}-android11.txt" || true
          {
            printf 'source=%s\nvariant=%s\nandroid=11\nselinux=enforcing\n' "$GITHUB_SHA" "$VARIANT"
            printf 'kernelsu=BakaSU\nsusfs=v2.3.0\nbase=mint3-a50-a11-3-1\n'
          } > "release/build-info-${VARIANT}.txt"

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a50-android11-${{ matrix.variant }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-${{ matrix.variant }}
          path: ci-logs/build.log
          if-no-files-found: ignore
          retention-days: 7